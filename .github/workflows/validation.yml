name: Application and database validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test authentication policy
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  database:
    name: Local Supabase database checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start disposable local Supabase
        run: npm run supabase:start

      - name: Export local-only Supabase environment
        shell: bash
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            > .env.local

          set -a
          source .env.local
          set +a

          case "$NEXT_PUBLIC_SUPABASE_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "Refusing a non-local Supabase URL." >&2; exit 1 ;;
          esac

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Rebuild fresh database from migrations
        run: npm run db:reset

      - name: Lint database schema
        run: npm run db:lint

      - name: Run Phase 1, Phase 2, and Phase 3 pgTAP suites
        run: npm run db:test

      - name: Run authenticated inventory concurrency tests
        run: npm run db:test:inventory-concurrency

      - name: Run authenticated session integration tests
        run: npm run db:test:auth-sessions

      - name: Stop and remove local Supabase
        if: always()
        run: npm run supabase:stop -- --no-backup || true
